<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>对弈项目 · 选择模式</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f1ea;
    color: #333;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 900px; width: 100%; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .hint { font-size: 13px; color: #888; margin-bottom: 32px; }
  .modes {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode {
    flex: 1 1 220px;
    max-width: 260px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 28px 18px;
    text-decoration: none;
    color: #333;
    transition: box-shadow .15s ease, transform .15s ease;
    display: block;
  }
  .mode .icon { font-size: 34px; margin-bottom: 10px; display: block; }
  .mode .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .mode .desc { font-size: 12px; color: #888; }

  .mode.active {
    cursor: pointer;
    border-color: #2f6f4f;
  }
  .mode.active:hover {
    box-shadow: 0 4px 14px rgba(47,111,79,0.18);
    transform: translateY(-2px);
  }
  .mode.active .title { color: #2f6f4f; }

  .mode.soon {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
    position: relative;
  }
  .mode.soon .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 10px;
    background: #b8860b;
    color: #fff;
    padding: 2px 6px;
    border-radius: 10px;
  }

  footer { margin-top: 36px; font-size: 11px; color: #aaa; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>对弈原型</h1>
    <div class="hint">选择一种模式开始</div>

    <div class="modes">
      <a class="mode active" href="/calibration.html?mode=pvp">
        <span class="icon">🧑‍🤝‍🧑</span>
        <div class="title">真人对战</div>
        <div class="desc">Player - Player</div>
      </a>

      <a class="mode active" href="/calibration.html?mode=ai">
        <span class="icon">🤖</span>
        <div class="title">人机对战</div>
        <div class="desc">Player - AI</div>
      </a>

      <a class="mode active" href="/demo">
        <span class="icon">🎮</span>
        <div class="title">演示</div>
        <div class="desc">Demo</div>
      </a>
    </div>

    <footer>对弈项目原型 · 服务器仅负责调度与透传</footer>
  </div>
</body>
</html>
